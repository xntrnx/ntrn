<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obra — theikkyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital@0;1&family=Newsreader:ital,wght@1,300..500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0B0A;
    --fg: #ECE8E1;
    --muted: #726C60;
    --stamp-amber: #C7A45E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at 50% 30%, #141310 0%, var(--bg) 65%);
    color: var(--fg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 6vh 20px 8vh;
    font-family: "Newsreader", serif;
  }

  .topnav{
    width:100%;
    max-width: 900px;
    display:flex;
    justify-content:space-between;
    margin-bottom: 4vh;
  }
  .topnav a{
    font-family: "Courier Prime", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration:none;
  }
  .topnav a:hover{ color: var(--fg); }

  .stage{
    position:relative;
    width:100%;
    max-width: 720px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 40vh;
  }
  .frame{
    position:absolute;
    inset: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform: translateY(14px) scale(0.985);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .frame.active{ opacity:1; transform: translateY(0) scale(1); position:relative; }
  .frame img{
    max-width:100%;
    max-height: 66vh;
    width:auto; height:auto;
    display:block;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6);
  }

  .field-label{
    font-family: "Courier Prime", ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1{
    margin: 10px 0 4px;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(24px, 4vw, 34px);
    text-align:center;
  }
  .meta{
    font-family: "Courier Prime", ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 16px;
    text-align:center;
  }
  .desc{
    max-width: 520px;
    text-align:center;
    font-size: 15px;
    line-height: 1.6;
    color: #C9C4B8;
    margin-bottom: 22px;
  }
  .price-row{
    display:flex;
    align-items:center;
    gap: 14px;
    margin-bottom: 26px;
  }
  .price{ font-size: 18px; }
  .badge{
    font-family: "Courier Prime", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 3px 7px;
    border: 1px solid currentColor;
  }
  .badge.disponible{ color: #7A9C81; }
  .badge.vendida{ color: var(--stamp-amber); }

  .btn{
    display:inline-block;
    font-family: "Courier Prime", ui-monospace, monospace;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    padding: 10px 18px;
    border: 1px solid var(--fg);
    color: var(--fg);
    text-decoration:none;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .btn:hover{ background: var(--fg); color: var(--bg); }

  .center-msg{
    text-align:center;
    font-family: "Courier Prime", ui-monospace, monospace;
    font-size: 13px;
    color: var(--muted);
  }
  #info{
    max-width: 620px;
    margin-top: 3vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  @media (prefers-reduced-motion: reduce){
    .frame{ transition: opacity 0.01s linear, transform 0.01s linear; }
  }
</style>
</head>
<body>

  <div class="topnav">
    <a href="galeria.html">← Galería</a>
    <a href="index.html">theikkyu</a>
  </div>

  <div class="stage" id="stage">
    <div class="center-msg">cargando…</div>
  </div>

  <div id="info"></div>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const workId = params.get("id");
  const stage = document.getElementById("stage");
  const info = document.getElementById("info");

  if (!workId){
    stage.innerHTML = `<div class="center-msg">Falta el id de la obra. Ábrela desde la galería.</div>`;
    return;
  }

  let listing = null, ficha = null;
  try{
    const [idxRes, workRes] = await Promise.all([
      fetch("works/index.json", { cache:"no-store" }),
      fetch(`works/${encodeURIComponent(workId)}.json`, { cache:"no-store" }),
    ]);
    if (idxRes.ok){
      const list = await idxRes.json();
      listing = list.find(i => i.id === workId) || null;
    }
    if (workRes.ok) ficha = await workRes.json();
  }catch(e){ /* seguimos con lo que sí haya llegado */ }

  const fotos = (ficha && ficha.fotos) || [];
  if (!fotos.length){
    stage.innerHTML = `<div class="center-msg">Esta obra todavía no tiene fotos cargadas.</div>`;
  } else {
    stage.innerHTML = fotos.map((src, i) =>
      `<div class="frame${i===0?" active":""}"><img src="${src}" alt=""></div>`
    ).join("");
    if (fotos.length > 1){
      const frames = Array.from(stage.querySelectorAll(".frame"));
      let i = 0;
      setInterval(() => {
        frames[i].classList.remove("active");
        i = (i + 1) % frames.length;
        frames[i].classList.add("active");
      }, 4200);
    }
  }

  const titulo = (listing && listing.titulo) || (ficha && ficha.titulo) || "(sin título)";
  const tecnica = (listing && listing.tecnica) || (ficha && ficha.tecnica) || "";
  const anio = (listing && listing.anio) || (ficha && ficha.anio) || "";
  const dimensiones = ficha && ficha.dimensiones;
  const descripcion = ficha && ficha.descripcion;
  const precioMXN = listing && listing.precioMXN;
  const disponible = listing ? !!listing.disponible : null;

  const precioFmt = typeof precioMXN === "number"
    ? precioMXN.toLocaleString("es-MX", { style:"currency", currency:"MXN", maximumFractionDigits:0 })
    : "";

  info.innerHTML = `
    <div class="field-label" style="text-align:center">${workId}</div>
    <h1>${titulo}</h1>
    <div class="meta">${tecnica}${tecnica&&anio?" · ":""}${anio}${dimensiones?" · "+dimensiones:""}</div>
    ${descripcion ? `<p class="desc">${descripcion}</p>` : ""}
    ${precioFmt ? `
      <div class="price-row">
        <div class="price">${precioFmt}</div>
        <div class="badge ${disponible?"disponible":"vendida"}">${disponible?"DISPONIBLE":"VENDIDA"}</div>
      </div>` : ""}
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <a class="btn" href="verify.html?id=${encodeURIComponent(workId)}">Ver certificado</a>
      ${disponible ? `<a class="btn" href="comprar.html?id=${encodeURIComponent(workId)}">Comprar</a>` : ""}
    </div>
  `;
})();
</script>
</body>
</html>
