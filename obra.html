<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300..500;1,300..500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<!-- En navegadores Chromium, espera a que exista la imagen para que la transición desde la galería sea limpia. -->
<link rel="expect" href="#hero" blocking="render">
<style>
  body.noscroll{ overflow:hidden; }

  .wrap{
    max-width:1440px; margin:0 auto;
    padding:15vh clamp(18px,5vw,80px) 8vh;
    display:grid; grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);
    gap:clamp(28px,6vw,100px);
    align-items:start;
  }
  @media (max-width:899px){ .wrap{ grid-template-columns:1fr; padding-top:12vh; } }

  .viewer{ position:relative; min-width:0; }
  .canvas{ display:flex; justify-content:center; }
  .float{ animation:bob 12s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  .tilt{ transition:transform .6s var(--ease); }

  #hero{
    height:min(78vh,1000px); width:auto; max-width:100%;
    aspect-ratio:var(--r,.8);
    object-fit:contain;
    opacity:0; transition:opacity .7s ease;
    cursor:zoom-in;
    box-shadow:0 50px 110px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(230,226,214,.05);
    background:rgba(230,226,214,.035);
  }
  #hero.ready{ opacity:1; }

  .pager{
    display:flex; justify-content:center; align-items:center; gap:22px;
    margin-top:26px; color:var(--ash); font-style:italic; font-size:16px;
  }
  .pager[hidden]{ display:none; }
  .pager button{
    font:inherit; color:var(--bone); background:none; border:0; cursor:pointer; padding:4px 2px;
  }
  .pager button:hover{ color:#fff; }

  .label{ position:sticky; top:14vh; min-width:0; }
  @media (max-width:899px){ .label{ position:static; } }
  .label .id{ color:var(--ash); font-size:15px; }
  .label h1{
    margin:8px 0 14px;
    font:400 clamp(28px,3.6vw,46px)/1.1 var(--type);
    letter-spacing:-.04em;
  }
  .label .lines{ color:var(--ash); font-size:17px; }
  .label .lines div{ line-height:1.55; }
  .label .desc{ margin:26px 0 0; max-width:44ch; font-size:17px; line-height:1.7; color:#CFCBBE; }
  .label .sale{
    margin-top:34px; padding-top:22px;
    border-top:1px solid rgba(230,226,214,.14);
  }
  .price{
    margin:8px 0 22px;
    font:300 36px/1 var(--serif);
    font-variant-numeric:lining-nums;
  }
  .actions{ display:flex; flex-wrap:wrap; gap:14px 26px; align-items:center; }
  .fine{ margin:16px 0 0; color:var(--ash); font-size:15px; }

  .adj{
    max-width:1440px; margin:0 auto;
    padding:6vh clamp(18px,5vw,80px) 14vh;
    display:flex; justify-content:space-between; gap:24px;
  }
  .adj a{ text-decoration:none; max-width:44%; }
  .adj a:last-child{ text-align:right; margin-left:auto; }
  .adj small{ display:block; color:var(--ash); font-size:15px; }
  .adj span{ font:400 clamp(18px,2vw,24px)/1.25 var(--type); letter-spacing:-.03em; transition:color .3s ease; color:var(--ash); }
  .adj a:hover span{ color:var(--bone); }

  
  /* Ampliación a pantalla completa */
  .zoom{
    position:fixed; inset:0; z-index:50; background:rgba(5,8,7,.96);
    overflow:hidden; touch-action:none;
  }
  .zoom[hidden]{ display:none; }
  .zoom img{
    width:100vw; height:100vh; object-fit:contain;
    cursor:zoom-in; transition:transform .45s var(--ease);
  }
  .zoom img.in{ transform:scale(2.4); cursor:zoom-out; }
  .zoom button{
    position:absolute; top:18px; right:clamp(18px,4vw,44px);
    font:italic 400 18px/1 var(--serif); color:var(--bone);
    background:none; border:0; cursor:pointer; padding:6px 2px;
  }

  @media (prefers-reduced-motion:reduce){
    .float{ animation:none; }
    .tilt, #hero, .zoom img{ transition:none; }
  }
</style>
</head>
<body>

<header class="bar">
  <a href="galeria.html" id="back">Galería</a>
  <a href="index.html">Inicio</a>
</header>

<main class="wrap">
  <section class="viewer" aria-label="Fotografías de la obra">
    <div class="canvas"><div class="float"><div class="tilt" id="tilt">
      <img id="hero" alt="" decoding="async" tabindex="0" role="button" aria-label="Ampliar imagen">
    </div></div></div>
    <script>
      // Muestra al instante la miniatura que ya está en caché (la que viene de la galería).
      (function(){ try{
        var id = new URLSearchParams(location.search).get("id"); if(!id) return;
        var img = document.getElementById("hero");
        img.style.viewTransitionName = "obra-" + id.replace(/[^A-Za-z0-9_-]/g, "_");
        var raw = sessionStorage.getItem("obra:" + id); if(!raw) return;
        var o = JSON.parse(raw);
        if (o.ratio) img.style.setProperty("--r", o.ratio);
        if (o.thumb){ img.src = o.thumb; img.className = "ready"; }
      }catch(e){} })();
    </script>
    <div class="pager" id="pager" hidden>
      <button type="button" id="prev" aria-label="Foto anterior">Anterior</button>
      <span id="count"></span>
      <button type="button" id="next" aria-label="Foto siguiente">Siguiente</button>
    </div>
  </section>

  <aside class="label" id="label"><p class="note">Cargando obra…</p></aside>
</main>

<nav class="adj" id="adj" aria-label="Otras obras"></nav>

<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Imagen ampliada" hidden>
  <button type="button" id="zclose">Cerrar</button>
  <img alt="">
</div>

<script src="assets/site.js"></script>
<script>
(async function(){
  const S = window.Site;
  const id = new URLSearchParams(location.search).get("id");
  const hero = document.getElementById("hero");
  const label = document.getElementById("label");
  const pager = document.getElementById("pager");
  const countEl = document.getElementById("count");
  const adj = document.getElementById("adj");

  if (!id){
    label.innerHTML = '<p class="note">Falta el id de la obra. Entra desde la galería.</p>';
    return;
  }
  try{ sessionStorage.setItem("lastObra", id); }catch(e){}
  hero.style.viewTransitionName = S.vtName(id);

  const [a, b] = await Promise.allSettled([
    fetch("works/index.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : []),
    fetch("works/" + encodeURIComponent(id) + ".json", { cache: "no-store" }).then((r) => r.ok ? r.json() : null)
  ]);
  const list = a.status === "fulfilled" && Array.isArray(a.value) ? a.value : [];
  const ficha = b.status === "fulfilled" ? b.value : null;
  const item = list.find((o) => o.id === id) || null;

  if (!item && !ficha){
    label.innerHTML = '<p class="note">No se encontró la obra ' + S.esc(id) + '.</p>';
    return;
  }

  const titulo = (item && item.titulo) || (ficha && ficha.titulo) || id;
  const tecnica = (item && item.tecnica) || (ficha && ficha.tecnica) || "";
  const anio = (item && item.anio) || (ficha && ficha.anio) || "";
  const dim = (ficha && ficha.dimensiones) || "";
  const desc = (ficha && ficha.descripcion) || "";
  const open = item ? !!item.disponible : false;
  const price = item ? S.fmtMXN(item.precioMXN) : "";
  document.title = titulo;

  label.innerHTML =
    '<div class="id">' + S.esc(id) + '</div>' +
    '<h1>' + S.esc(titulo) + '</h1>' +
    '<div class="lines">' +
      (tecnica ? '<div>' + S.esc(tecnica) + '</div>' : '') +
      (dim ? '<div>' + S.esc(dim) + '</div>' : '') +
      (anio ? '<div>' + S.esc(anio) + '</div>' : '') +
    '</div>' +
    (desc ? '<p class="desc">' + S.esc(desc) + '</p>' : '') +
    '<div class="sale ' + (open ? "open" : "sold") + '">' +
      '<span class="st"><i class="dot"></i>' + (open ? "Disponible" : "Vendida") + '</span>' +
      (open && price ? '<div class="price">' + price + '</div>' : '<div style="height:18px"></div>') +
      '<div class="actions">' +
        (open ? '<a class="btn" href="comprar.html?id=' + encodeURIComponent(id) + '">Comprar</a>' : '') +
        '<a class="link" href="verify.html?id=' + encodeURIComponent(id) + '">Ver certificado de autenticidad</a>' +
      '</div>' +
      (open ? '<p class="fine">Incluye certificado de autenticidad firmado.</p>' : '') +
    '</div>';

  /* Fotos: la primera aparece con la miniatura ya en caché y se reemplaza por la
     versión grande en cuanto termina de cargar. */
  const fotos = (ficha && Array.isArray(ficha.fotos) && ficha.fotos.length)
    ? ficha.fotos : (item && item.thumb ? [item.thumb] : []);
  let idx = 0;

  function loadImg(src, cb){
    const im = new Image();
    im.onload = () => { (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(() => cb(im)); };
    im.onerror = () => cb(null);
    im.src = src;
  }
  function showPhoto(i, instant){
    idx = (i + fotos.length) % fotos.length;
    countEl.textContent = (idx + 1) + " / " + fotos.length;
    hero.alt = titulo + (fotos.length > 1 ? ", foto " + (idx + 1) : "");
    const swap = () => loadImg(fotos[idx], (im) => {
      if (!im){ if (hero.getAttribute("src")) hero.classList.add("ready"); return; }
      hero.style.setProperty("--r", im.naturalWidth / im.naturalHeight);
      hero.src = fotos[idx];
      hero.classList.add("ready");
    });
    if (instant) swap();
    else { hero.classList.remove("ready"); setTimeout(swap, S.reduce ? 0 : 260); }
  }
  if (fotos.length){
    showPhoto(0, true);
    if (fotos.length > 1){
      pager.hidden = false;
      document.getElementById("prev").addEventListener("click", () => showPhoto(idx - 1));
      document.getElementById("next").addEventListener("click", () => showPhoto(idx + 1));
    }
  }else{
    document.querySelector(".canvas").innerHTML = '<p class="note">Esta obra todavía no tiene fotos.</p>';
  }

  /* Inclinación sutil con el cursor */
  const tilt = document.getElementById("tilt");
  if (matchMedia("(hover:hover)").matches && !S.reduce){
    hero.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse") return;
      const r = hero.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      tilt.style.transform = "perspective(1400px) rotateY(" + (x * 3.5).toFixed(2) + "deg) rotateX(" + (-y * 3.5).toFixed(2) + "deg)";
    });
    hero.addEventListener("pointerleave", () => { tilt.style.transform = ""; });
  }

  /* Ampliación: clic para abrir, clic para acercar, el cursor (o el dedo) recorre la imagen. */
  const zoom = document.getElementById("zoom");
  const zimg = zoom.querySelector("img");
  const zclose = document.getElementById("zclose");
  let zoomed = false, lastFocus = null;
  function setOrigin(e){
    zimg.style.transformOrigin = (e.clientX / innerWidth * 100).toFixed(1) + "% " + (e.clientY / innerHeight * 100).toFixed(1) + "%";
  }
  function openZoom(){
    if (!hero.getAttribute("src")) return;
    lastFocus = document.activeElement;
    zimg.src = fotos[idx] || hero.getAttribute("src");
    zimg.alt = hero.alt;
    zoom.hidden = false;
    document.body.classList.add("noscroll");
    zclose.focus();
  }
  function closeZoom(){
    zoom.hidden = true; zoomed = false;
    zimg.classList.remove("in"); zimg.style.transformOrigin = "";
    document.body.classList.remove("noscroll");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  hero.addEventListener("click", openZoom);
  hero.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openZoom(); } });
  zclose.addEventListener("click", closeZoom);
  zimg.addEventListener("click", (e) => {
    zoomed = !zoomed;
    zimg.classList.toggle("in", zoomed);
    if (zoomed) setOrigin(e);
  });
  zoom.addEventListener("pointermove", (e) => { if (zoomed) setOrigin(e); });
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !zoom.hidden) closeZoom();
    else if (zoom.hidden && fotos.length > 1){
      if (e.key === "ArrowRight") showPhoto(idx + 1);
      if (e.key === "ArrowLeft") showPhoto(idx - 1);
    }
  });

  /* Deslizar para cambiar de foto en pantallas táctiles */
  let sx = null;
  const viewer = document.querySelector(".viewer");
  viewer.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  viewer.addEventListener("touchend", (e) => {
    if (sx === null || fotos.length < 2) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) showPhoto(idx + (dx < 0 ? 1 : -1));
  }, { passive: true });

  /* Obra anterior y siguiente, para seguir recorriendo sin volver a la galería */
  const k = list.findIndex((o) => o.id === id);
  if (k >= 0 && list.length > 1){
    const prev = list[(k - 1 + list.length) % list.length];
    const next = list[(k + 1) % list.length];
    const link = (o, txt) => '<a href="obra.html?id=' + encodeURIComponent(o.id) + '"><small>' + txt + '</small><span>' + S.esc(o.titulo || o.id) + '</span></a>';
    adj.innerHTML = list.length > 2
      ? link(prev, "Obra anterior") + link(next, "Obra siguiente")
      : link(next, "Otra obra");
  }
})();
</script>
</body>
</html>
