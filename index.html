<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Works</title>
<meta name="description" content="Original works, each issued with a digitally signed certificate of authenticity.">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="page">
  <section class="intro" id="intro"></section>

  <div class="works-head">
    <h2 class="label" id="works-count">Works</h2>
    <div class="filter" id="filter" role="group" aria-label="Filter works" hidden>
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="available" aria-pressed="false">Available</button>
    </div>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>
  <noscript><p class="note">This gallery needs JavaScript to load the works.</p></noscript>

  <section class="contact" id="contact">
    <h2 class="label">Contact</h2>
    <div id="contact-body"></div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/gallery.js"></script>
</body>
</html>
