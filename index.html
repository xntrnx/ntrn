<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería — Archivo de obras</title>
<style>
  :root{
    --paper:#E7E1CE;
    --paper-edge:#D9D1B8;
    --ink:#211C15;
    --ink-faint:#5B5343;
    --rule:#B7AC8B;
    --stamp-green:#3F5A45;
    --stamp-amber:#8A6A1E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:#14110D;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    color: var(--ink);
    padding: 40px 16px 80px;
  }
  .drawer-label{
    max-width: 980px;
    margin: 0 auto 22px;
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #A79C7D;
    text-align:center;
  }
  .grid{
    max-width: 980px;
    margin: 0 auto;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }
  .card{
    position:relative;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 14px 30px rgba(0,0,0,0.4);
    padding: 20px 18px 18px;
    text-decoration:none;
    color: var(--ink);
    display:flex;
    flex-direction:column;
  }
  .card::before, .card::after{
    content:"";
    position:absolute;
    top: 10px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #14110D;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .card::before{ left: 13px; }
  .card::after{ right: 13px; }
  .thumb-wrap{
    aspect-ratio: 4/5;
    overflow:hidden;
    margin: 6px 0 12px;
    border: 1px solid var(--paper-edge);
    background: #d9d1b8;
  }
  .thumb-wrap img{ width:100%; height:100%; object-fit:cover; filter: sepia(0.12) contrast(1.02); display:block; }
  .field-label{
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }
  h2{
    margin: 3px 0 2px;
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    line-height:1.2;
  }
  .meta{
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .bottom-row{
    margin-top: auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
  }
  .price{ font-size: 14px; }
  .badge{
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border: 1px solid currentColor;
  }
  .badge.disponible{ color: var(--stamp-green); }
  .badge.vendida{ color: var(--stamp-amber); }
  .actions{
    display:flex;
    gap: 8px;
    margin-top: 10px;
  }
  .actions a{
    flex:1;
    text-align:center;
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 7px 6px;
    border: 1px solid var(--ink-faint);
    color: var(--ink);
    text-decoration:none;
  }
  .actions a.buy{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .empty, .error{
    max-width: 480px;
    margin: 0 auto;
    text-align:center;
    color: #A79C7D;
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="drawer-label">archivo de obras — galería</div>
  <div class="grid" id="grid">
    <div class="empty">cargando…</div>
  </div>

<script>
(async function(){
  const grid = document.getElementById("grid");
  try{
    const res = await fetch("works/index.json", { cache:"no-store" });
    if (!res.ok) throw new Error("no se pudo cargar el catálogo");
    const items = await res.json();
    if (!items.length){
      grid.innerHTML = `<div class="empty">Todavía no hay obras registradas.</div>`;
      return;
    }
    grid.innerHTML = items.map(renderCard).join("");
  }catch(e){
    grid.innerHTML = `<div class="error">No se pudo cargar el catálogo (works/index.json). ${e.message}</div>`;
  }

  function renderCard(item){
    const badgeClass = item.disponible ? "disponible" : "vendida";
    const badgeText = item.disponible ? "DISPONIBLE" : "VENDIDA";
    const precio = typeof item.precioMXN === "number"
      ? item.precioMXN.toLocaleString("es-MX", { style:"currency", currency:"MXN", maximumFractionDigits:0 })
      : "";
    return `
      <div class="card">
        <div class="field-label">${item.id}</div>
        ${item.thumb ? `<div class="thumb-wrap"><img src="${item.thumb}" alt=""></div>` : ""}
        <h2>${item.titulo||"(sin título)"}</h2>
        <div class="meta">${item.tecnica||""}${item.tecnica&&item.anio?" · ":""}${item.anio||""}</div>
        <div class="bottom-row">
          <div class="price">${precio}</div>
          <div class="badge ${badgeClass}">${badgeText}</div>
        </div>
        <div class="actions">
          <a href="verify.html?id=${encodeURIComponent(item.id)}">certificado</a>
          ${item.disponible ? `<a class="buy" href="comprar.html?id=${encodeURIComponent(item.id)}">comprar</a>` : ""}
        </div>
      </div>`;
  }
})();
</script>
</body>
</html>
