<style>
  body{ overflow:hidden; display:grid; place-items:center; min-height:100svh; }

  #rain{
    position:fixed; inset:0; width:100%; height:100%; z-index:-1;
    opacity:.34; pointer-events:none;
    -webkit-mask-image:radial-gradient(ellipse 52% 46% at 50% 48%, transparent 22%, #000 88%);
            mask-image:radial-gradient(ellipse 52% 46% at 50% 48%, transparent 22%, #000 88%);
  }

  .stage{
    position:relative;
    width:min(100%, 960px);
    height:44vh; min-height:240px;
    display:grid; place-items:center;
    padding:0 24px;
  }
  .word{
    position:absolute;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    text-align:center; white-space:nowrap;
  }
  .js .word{ visibility:hidden; }
  .js .word.active{ visibility:visible; }

  .kanji{
    font:400 clamp(22px,3.4vw,34px)/1 "Noto Serif JP", serif;
    color:var(--ash);
    letter-spacing:.2em;
  }
  .w-ikkyu{
    font:italic 400 clamp(52px,11vw,124px)/1 var(--serif);
    letter-spacing:-.02em;
  }
  .w-pausa{
    font:400 clamp(30px,6.6vw,66px)/1 "Courier Prime", ui-monospace, monospace;
    letter-spacing:.12em;
  }
  .w-ceca{
    font:italic 800 clamp(54px,12vw,132px)/1 "Fraunces", var(--serif);
    font-variation-settings:"SOFT" 100, "WONK" 1;
    letter-spacing:-.015em;
  }

  .enter{
    position:fixed; left:50%; bottom:11vh; transform:translateX(-50%);
    font:italic 400 19px/1 var(--serif);
    color:var(--ash); text-decoration:none;
    padding:8px 2px;
    border-bottom:1px solid rgba(139,145,136,.35);
    opacity:0; transition:opacity .8s ease, color .3s ease, border-color .3s ease;
    white-space:nowrap;
  }
  .enter.show{ opacity:1; }
  .enter:hover{ color:var(--bone); border-color:var(--bone); }
  .no-js .enter, html:not(.js) .enter{ opacity:1; }

  <canvas id="rain" aria-hidden="true"></canvas>

        <span data-t="una pausa">una pausa</span>

  <a class="enter" href="galeria.html" data-t="Entrar a la galería">Entrar a la galería</a>

<script src="assets/site.js"></script>
<script>
(function(){
  const S = window.Site;
  const words = Array.from(document.querySelectorAll(".word"));
  const enter = document.querySelector(".enter");
  const HOLD = 3300;

  /* Lluvia de código: columnas de glifos que caen, muy tenue y con el centro
     despejado para que los nombres sean lo primero que se lee. */
  function startRain(){
    if (S.reduce) return;
    const cv = document.getElementById("rain");
    const ctx = cv.getContext("2d");
    const fs = innerWidth < 700 ? 14 : 16;
    let cols = 0, drops = [], w = 0, h = 0, last = 0;
    function size(){
      w = cv.width = innerWidth; h = cv.height = innerHeight;
      cols = Math.ceil(w / fs);
      drops = Array.from({ length: cols }, () => -Math.random() * 40);
    }
    size();
    addEventListener("resize", size);
    function tick(now){
      requestAnimationFrame(tick);
      if (now - last < 60) return;
      last = now;
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,.10)";
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "source-over";
      ctx.font = fs + 'px "Noto Sans JP", monospace';
      ctx.fillStyle = "rgba(63,209,132,.9)";
      for (let i = 0; i < cols; i++){
        const y = drops[i] * fs;
        if (y > 0) ctx.fillText(S.rnd(), i * fs, y);
        if (y > h && Math.random() > .975) drops[i] = 0;
        drops[i]++;
      }
    }
    requestAnimationFrame(tick);
  }

  async function run(){
    await S.fontsReady([
      'italic 400 40px Newsreader',
      '400 40px "Courier Prime"',
      'italic 800 40px Fraunces',
      '400 20px "Noto Serif JP"',
      '400 16px "Noto Sans JP"'
    ], 2200);
    startRain();

    if (S.reduce){
      // Sin movimiento: los nombres se alternan con un fundido simple.
      enter.classList.add("show");
      let i = 0;
      words[0].classList.add("active");
      setInterval(() => {
        words[i].classList.remove("active");
        i = (i + 1) % words.length;
        words[i].classList.add("active");
      }, 4000);
      return;
    }

    let i = 0, first = true;
    for(;;){
      const w = words[i];
      const parts = Array.from(w.querySelectorAll("[data-t]"));
      w.classList.add("active");
      await Promise.all(parts.map((el, k) => S.decode(el, el.dataset.t, { delay: k * 160 })));
      if (first){
        first = false;
        enter.classList.add("show");
        S.decode(enter, enter.dataset.t, { step: 35, scrambleMs: 400, jitter: 120 });
      }
      await S.sleep(HOLD);
      await Promise.all(parts.map((el) => S.scramble(el, 650)));
      w.classList.remove("active");
      parts.forEach((el) => { el.style.transition = "none"; el.style.opacity = ""; });
      await S.sleep(180);
      i = (i + 1) % words.length;
    }
  }
  run();
})();
</script>
