java1:`package registro.obras;

import java.security.MessageDigest;
import java.util.ArrayList;
import java.util.List;

public class Certificado {

    private final String id;
    private final String titulo;
    private final List<String> fotos = new ArrayList<>();
    private byte[] firma;

    public Certificado(String id, String titulo) {
        this.id = id;
        this.titulo = titulo;
    }

    public String huella(byte[] datos) throws Exception {
        MessageDigest md = MessageDigest.getInstance("SHA-256");
        byte[] hash = md.digest(datos);
        StringBuilder sb = new StringBuilder();
        for (byte b : hash) {
            sb.append(String.format("%02x", b));
        }
        return sb.toString();
    }

    public boolean estaFirmado() {
        return firma != null && firma.length == 64;
    }

    public void agregarFoto(String ruta) {
        if (ruta == null || ruta.isEmpty()) {
            return;
        }
        fotos.add(ruta);
    }

    public int totalFotos() {
        return fotos.size();
    }

    @Override
    public String toString() {
        return id + ": " + titulo;
    }
}

java2:`package registro.obras;

import java.util.HashMap;
import java.util.List;
import java.util.ArrayList;
import java.util.Map;

public class Galeria {

    private final Map<String, Obra> obras = new HashMap<>();

    public void agregar(Obra obra) {
        if (obra == null) {
            throw new IllegalArgumentException("obra");
        }
        obras.put(obra.getId(), obra);
    }

    public List<Obra> disponibles() {
        List<Obra> salida = new ArrayList<>();
        for (Obra o : obras.values()) {
            if (o.estaDisponible()) {
                salida.add(o);
            }
        }
        return salida;
    }

    public Obra buscar(String id) {
        Obra obra = obras.get(id);
        if (obra == null) {
            throw new IllegalStateException("no existe " + id);
        }
        return obra;
    }

    // pausa
    public int total() {
        return obras.size();
    }

    public static void main(String[] args) {
        Galeria g = new Galeria();
        System.out.println("obras: " + g.total());
    }
}

  const KEYWORDS = "public|private|protected|class|static|void|int|new|return|if|else|for|while|import|package|final|try|catch|throw|throws|this|null|true|false|extends|implements";
  const RE = new RegExp(
    "(\\/\\/.*|&lt;!--.*?--&gt;)" +                    // 1 comentarios
    "|(\"(?:[^\"\\\\]|\\\\.)*\")" +                    // 2 cadenas
    "|(&lt;\\/?[a-zA-Z!][\\w-]*|\\/?&gt;)" +           // 3 etiquetas
    "|\\b(" + KEYWORDS + ")\\b" +                      // 4 palabras reservadas
    "|\\b(\\d+)\\b", "g");                              // 5 números

  function highlight(code){
    return code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .split("\n").map((ln) => ln.replace(RE, (m, c, s, t, k, n) =>
        c ? '<span class="c">' + m + '</span>' :
        s ? '<span class="s">' + m + '</span>' :
        t ? '<span class="k">' + m + '</span>' :
        k ? '<span class="k">' + m + '</span>' :
        n ? '<span class="n">' + m + '</span>' : m)).join("\n");
  }

  document.querySelectorAll(".track").forEach((tr) => {
    const html = highlight(SRC[tr.dataset.src] || "");
    // Dos copias seguidas: al desplazar el 50% el bucle es invisible.
    tr.innerHTML = html + "\n" + html + "\n";
  });

  const words = Array.from(document.querySelectorAll(".word"));
  const enter = document.querySelector(".enter");
  const HOLD = 3200;

  async function run(){
    await S.fontsReady(['400 40px "Courier Prime"', '400 16px "Noto Sans JP"'], 2200);

    if (S.reduce){
      // Sin movimiento: los nombres se alternan sin efecto.
      enter.classList.add("show");
      let i = 0;
      words[0].classList.add("active");
      setInterval(() => {
        words[i].classList.remove("active");
        i = (i + 1) % words.length;
        words[i].classList.add("active");
      }, 4000);
      return;
    }

    let i = 0, first = true;
    for(;;){
      const w = words[i];
      const part = w.querySelector("[data-t]");
      w.classList.add("active");
      await S.decode(part, part.dataset.t, { step: 70, scrambleMs: 560 });
      if (first){
        first = false;
        enter.classList.add("show");
        S.decode(enter, enter.dataset.t, { step: 35, scrambleMs: 400, jitter: 120 });
      }
      await S.sleep(HOLD);
      await S.scramble(part, 650);
      w.classList.remove("active");
      part.style.transition = "none"; part.style.opacity = "";
      await S.sleep(180);
      i = (i + 1) % words.length;
    }
  }
  run();
})();
