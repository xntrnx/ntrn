<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería</title>
<meta name="description" content="Obra pictórica única con certificado de autenticidad firmado y verificable en línea.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300..500;1,300..500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap&text=%EF%BD%B1%EF%BD%B2%EF%BD%B3%EF%BD%B4%EF%BD%B5%EF%BD%B6%EF%BD%B7%EF%BD%B8%EF%BD%B9%EF%BD%BA%EF%BD%BB%EF%BD%BC%EF%BD%BD%EF%BD%BE%EF%BD%BF%EF%BE%80%EF%BE%81%EF%BE%82%EF%BE%83%EF%BE%84%EF%BE%85%EF%BE%86%EF%BE%87%EF%BE%88%EF%BE%89%EF%BE%8A%EF%BE%8B%EF%BE%8C%EF%BE%8D%EF%BE%8E%EF%BE%8F%EF%BE%90%EF%BE%91%EF%BE%92%EF%BE%93%EF%BE%94%EF%BE%95%EF%BE%96%EF%BE%97%EF%BE%98%EF%BE%99%EF%BE%9A%EF%BE%9B%EF%BE%9C%EF%BE%9D0123456789%3A.%3D%2A%2B%3C%3E%7C">
<link rel="stylesheet" href="assets/site.css">
<style>
  .hero{
    max-width:1500px; margin:0 auto;
    padding:24vh clamp(18px,5vw,80px) 8vh;
  }
  .hero h1{
    margin:0;
    font:400 clamp(52px,12.5vw,170px)/.92 var(--type);
    letter-spacing:-.05em;
  }
  .hero p{
    margin:28px 0 0; max-width:38ch;
    color:var(--ash); font-size:18px; line-height:1.55;
  }
  .hero .count{ margin-top:10px; color:var(--bone); }

  .seg{ display:flex; gap:26px; }
  .seg button{
    color:var(--ash) !important;
    border-bottom:1px solid transparent !important;
    padding-bottom:6px !important;
    transition:color .3s ease, border-color .3s ease;
  }
  .seg button[aria-pressed="true"]{
    color:var(--bone) !important;
    border-bottom-color:var(--bone) !important;
  }

  /* El campo: composición asimétrica en 12 columnas; cada obra con su escala y
     su desfase vertical, sin recortar nunca la pintura. */
  .field{
    position:relative;
    max-width:1500px; margin:0 auto;
    padding:4vh clamp(18px,5vw,80px) 22vh;
    display:flex; flex-direction:column; gap:15vh;
  }
  .fig{ margin:0; min-width:0; width:78%; }
  .fig:nth-child(even){ align-self:flex-end; }
  .fig:nth-child(3n){ width:64%; }

  @media (min-width:900px){
    .field{
      display:grid; grid-template-columns:repeat(12,1fr);
      column-gap:clamp(16px,2.4vw,40px);
      row-gap:clamp(70px,13vh,160px);
      align-items:start;
    }
    .fig, .fig:nth-child(3n){ width:auto; align-self:start; }
    .fig.p0{ grid-column:2 / span 5; margin-top:0; }
    .fig.p1{ grid-column:8 / span 4; margin-top:16vh; }
    .fig.p2{ grid-column:4 / span 4; margin-top:2vh; }
    .fig.p3{ grid-column:9 / span 3; margin-top:20vh; }
    .fig.p4{ grid-column:1 / span 4; margin-top:6vh; }
    .fig.p5{ grid-column:6 / span 5; margin-top:10vh; }
    .field.solo .fig{ grid-column:4 / span 6; margin-top:0; }
  }

  .piece{ display:block; text-decoration:none; color:inherit; perspective:1000px; }
  .float{ animation:bob var(--bob,11s) ease-in-out var(--bd,0s) infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .tilt{ transition:transform .6s var(--ease); transform-style:preserve-3d; }
  .frame{
    position:relative; width:100%;
    background:rgba(230,226,214,.035);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(230,226,214,.05);
  }
  .frame img{
    width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity 1s ease;
  }
  .frame img.ready{ opacity:1; }

  figcaption{
    margin-top:22px;
    display:flex; flex-direction:column; gap:3px;
    opacity:.75; transition:opacity .4s ease;
  }
  .fig:hover figcaption, .fig:focus-within figcaption{ opacity:1; }
  figcaption .t{ font:400 19px/1.3 var(--type); letter-spacing:-.02em; }
  figcaption .m{ color:var(--ash); font-size:15px; }
  figcaption .s{
    margin-top:8px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:15px;
  }
  .pr{ color:var(--bone); font-variant-numeric:lining-nums tabular-nums; }

  @media (hover:hover){
    .field:has(.fig:hover) .fig:not(:hover){ opacity:.38; }
    .fig{ transition:opacity .5s ease; }
  }

  .note{
    max-width:46ch; margin:0 auto; padding:8vh 0; text-align:center;
    color:var(--ash); font-style:italic;
  }
  .note button{
    font:inherit; color:var(--bone); background:none; border:0;
    border-bottom:1px solid var(--ash); cursor:pointer; padding:0;
  }

  .hud{
    position:fixed; left:clamp(18px,4vw,44px); bottom:22px; z-index:15;
    display:flex; flex-direction:column; gap:2px;
    font-style:italic; font-size:15px; color:var(--ash);
    opacity:0; transition:opacity .5s ease; pointer-events:none;
    text-shadow:0 0 14px #000;
  }
  .hud.on{ opacity:1; }
  .hud .tt{ color:var(--bone); }

  .end{
    text-align:center; color:var(--ash); font-style:italic;
    padding:0 20px 14vh;
  }

  @media (prefers-reduced-motion:reduce){
    .float{ animation:none; }
    .tilt, .frame img{ transition:none; }
  }
</style>
</head>
<body>

<header class="bar">
  <a href="index.html">Inicio</a>
  <div class="seg" role="group" aria-label="Filtrar obras">
    <button type="button" data-f="all" aria-pressed="true">Todas</button>
    <button type="button" data-f="open" aria-pressed="false">Disponibles</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1 id="gh">Galería</h1>
    <p>Cada pieza es única y viene con un certificado de autenticidad firmado, verificable en línea.</p>
    <p class="count" id="count" aria-live="polite"></p>
  </section>

  <section class="field" id="field" aria-label="Obras">
    <p class="note">Cargando obras…</p>
  </section>

  <p class="end" id="end" hidden>Todas las obras incluyen certificado de autenticidad.</p>
</main>

<div class="hud" id="hud" aria-hidden="true"><span id="hudN"></span><span class="tt" id="hudT"></span></div>

<script src="assets/site.js"></script>
<script>
(async function(){
  const S = window.Site;
  const field = document.getElementById("field");
  const countEl = document.getElementById("count");
  const endEl = document.getElementById("end");
  const hud = document.getElementById("hud");
  const hudN = document.getElementById("hudN");
  const hudT = document.getElementById("hudT");
  const SPEEDS = [0.07, -0.05, 0.10, -0.08, 0.06, -0.10];
  const damp = innerWidth < 900 ? 0.6 : 1;

  let all = [], view = [], figs = [], bases = [], filter = "all", io = null;

  // El título de la página se "descifra" al entrar (mismo gesto que la portada).
  S.fontsReady(['400 80px "Courier Prime"', '400 16px "Noto Sans JP"'], 1200)
    .then(() => S.decode(document.getElementById("gh"), "Galería", { step: 70, scrambleMs: 600 }));

  try{
    const r = await fetch("works/index.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    all = await r.json();
  }catch(e){
    field.innerHTML = '<p class="note">No se pudo cargar el catálogo (works/index.json). ' +
      'Abre el sitio desde su dirección web, no con doble clic en el archivo, y revisa que works/index.json exista en el repositorio.</p>';
    return;
  }

  function figure(o, i){
    const ratio = Number(o.ratio) > 0 ? Number(o.ratio) : 0.8;
    const sp = (SPEEDS[i % SPEEDS.length] * damp).toFixed(3);
    const bob = (9 + (i * 1.7) % 5).toFixed(1);
    const bd = (-((i * 2.3) % 9)).toFixed(1);
    const open = !!o.disponible;
    const price = open ? S.fmtMXN(o.precioMXN) : "";
    const meta = [o.tecnica, o.anio].filter(Boolean).join(", ");
    return '<figure class="fig p' + (i % 6) + '" data-id="' + S.esc(o.id) + '" data-sp="' + sp + '" style="--bob:' + bob + 's;--bd:' + bd + 's">' +
      '<div class="px">' +
        '<a class="piece" href="obra.html?id=' + encodeURIComponent(o.id) + '" aria-label="' + S.esc(o.titulo || o.id) + ', ver obra">' +
          '<div class="float"><div class="tilt"><div class="frame" style="aspect-ratio:' + ratio + '">' +
            (o.thumb ? '<img src="' + S.esc(o.thumb) + '" alt="' + S.esc(o.titulo || "") + '" ' +
              (i < 2 ? 'fetchpriority="high"' : 'loading="lazy"') + ' decoding="async">' : '') +
          '</div></div></div>' +
        '</a>' +
        '<figcaption>' +
          '<span class="t">' + S.esc(o.titulo || "(sin título)") + '</span>' +
          (meta ? '<span class="m">' + S.esc(meta) + '</span>' : '') +
          '<span class="s ' + (open ? "open" : "sold") + '">' +
            '<span class="st"><i class="dot"></i>' + (open ? "Disponible" : "Vendida") + '</span>' +
            (price ? '<span class="pr">' + price + '</span>' : '') +
          '</span>' +
        '</figcaption>' +
      '</div></figure>';
  }

  function render(){
    view = all.filter((o) => filter === "all" || o.disponible);
    countEl.textContent = view.length === 1 ? "1 obra" : view.length + " obras";
    field.classList.toggle("solo", view.length === 1);
    endEl.hidden = !view.length;

    if (!all.length){
      field.innerHTML = '<p class="note">Todavía no hay obras publicadas.</p>';
      figs = []; return;
    }
    if (!view.length){
      field.innerHTML = '<p class="note">Por ahora no hay obras disponibles. <button type="button" id="seeAll">Ver todas</button></p>';
      document.getElementById("seeAll").addEventListener("click", () => setFilter("all"));
      figs = []; return;
    }

    field.innerHTML = view.map(figure).join("");
    figs = Array.from(field.querySelectorAll(".fig"));

    // Al volver desde la vista de una obra, su imagen regresa a su lugar con la transición.
    let last = null;
    try{ last = sessionStorage.getItem("lastObra"); sessionStorage.removeItem("lastObra"); }catch(e){}

    figs.forEach((f) => {
      const img = f.querySelector("img");
      if (!img) return;
      const frame = f.querySelector(".frame");
      const ready = () => {
        if (img.naturalWidth) frame.style.aspectRatio = img.naturalWidth + " / " + img.naturalHeight;
        img.classList.add("ready");
        measure();
      };
      if (img.complete && img.naturalWidth) ready();
      else img.addEventListener("load", ready, { once: true });
      if (last && f.dataset.id === last) img.style.viewTransitionName = S.vtName(last);
    });

    // Indicador de posición: qué obra está cruzando el centro de la pantalla.
    if (io) io.disconnect();
    io = new IntersectionObserver((es) => {
      es.forEach((e) => {
        if (!e.isIntersecting) return;
        const i = figs.indexOf(e.target);
        if (i < 0) return;
        hudN.textContent = (i + 1) + " / " + figs.length + "  ";
        hudT.textContent = view[i].titulo || "";
        hud.classList.add("on");
      });
    }, { rootMargin: "-45% 0px -45% 0px" });
    figs.forEach((f) => io.observe(f));

    measure(); update();
  }

  function setFilter(f){
    filter = f;
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === f)));
    hud.classList.remove("on");
    render();
    scrollTo(0, 0);
  }
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => setFilter(b.dataset.f)));

  /* Profundidad: cada obra se desplaza a distinta velocidad respecto al scroll.
     Solo se mueven las que están cerca de la pantalla. */
  function measure(){
    const ft = field.getBoundingClientRect().top + scrollY;
    bases = figs.map((f) => ({ c: ft + f.offsetTop + f.offsetHeight / 2, sp: Number(f.dataset.sp) }));
  }
  let ticking = false;
  function onScroll(){ if (!ticking){ ticking = true; requestAnimationFrame(update); } }
  function update(){
    ticking = false;
    const y = scrollY, vh = innerHeight;
    if (!S.reduce){
      for (let i = 0; i < figs.length; i++){
        const d = bases[i].c - (y + vh / 2);
        if (Math.abs(d) > vh * 1.3) continue;
        figs[i].firstElementChild.style.transform = "translate3d(0," + (d * bases[i].sp).toFixed(1) + "px,0)";
      }
    }
    if (y < vh * 0.45) hud.classList.remove("on");
  }
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", () => { measure(); update(); });
  if ("ResizeObserver" in window) new ResizeObserver(measure).observe(field);

  /* Inclinación suave al pasar el cursor (solo con mouse). */
  if (matchMedia("(hover:hover)").matches && !S.reduce){
    field.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse") return;
      const p = e.target.closest(".piece");
      if (!p) return;
      const r = p.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      p.querySelector(".tilt").style.transform =
        "rotateY(" + (x * 6).toFixed(2) + "deg) rotateX(" + (-y * 6).toFixed(2) + "deg) scale(1.015)";
    });
    field.addEventListener("pointerout", (e) => {
      const p = e.target.closest(".piece");
      if (p && !p.contains(e.relatedTarget)) p.querySelector(".tilt").style.transform = "";
    });
  }

  /* Al abrir una obra, la miniatura viaja a la vista grande (View Transitions). */
  field.addEventListener("click", (e) => {
    const a = e.target.closest(".piece");
    if (!a) return;
    const f = a.closest(".fig");
    const img = f.querySelector("img");
    const id = f.dataset.id;
    if (img){
      img.style.viewTransitionName = S.vtName(id);
      try{
        sessionStorage.setItem("obra:" + id, JSON.stringify({
          thumb: img.getAttribute("src"),
          ratio: img.naturalWidth ? img.naturalWidth / img.naturalHeight : null
        }));
      }catch(err){}
    }
  });

  render();
})();
</script>
</body>
</html>
