<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Verify a certificate</title>
<meta name="description" content="Check that a certificate of authenticity was signed by the artist and is the current one on record.">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="page verify">
  <div id="result"></div>

  <section class="verify-tools no-print">
    <h2 class="label">Verify a certificate</h2>
    <form id="lookup" class="row">
      <label class="field grow">
        <span>Work ID</span>
        <input type="text" id="lookup-id" autocomplete="off" spellcheck="false" placeholder="TLK-2026-001">
      </label>
      <button type="submit" class="btn">Look up</button>
    </form>
    <label class="field">
      <span>Or check a certificate file you were given (.json)</span>
      <input type="file" id="file" accept="application/json,.json">
    </label>
    <p class="fine">The file is checked in your browser. Nothing is uploaded.</p>
  </section>
  <noscript><p class="note">Verification needs JavaScript.</p></noscript>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/verify.js"></script>
</body>
</html>
